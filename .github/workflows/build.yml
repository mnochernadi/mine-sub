name: build-subscription
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build subscription
        env:
          OWN_NODES: ${{ secrets.OWN_NODES }}
        run: python build_sub.py
      - name: Commit output
        run: |
          git config user.name "sub-bot"
          git config user.email "sub-bot@users.noreply.github.com"
          git add subscription.txt
          git diff --cached --quiet || (git commit -m "update subscription" && git push)

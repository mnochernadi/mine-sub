name: build-subscription
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild]
permissions:
  contents: write
concurrency:
  group: build-subscription
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild every 20 minutes for about 5.5 hours
        shell: bash
        env:
          OWN_NODES: ${{ secrets.OWN_NODES }}
        run: |
          git config user.name "sub-bot"
          git config user.email "sub-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 5*3600 + 1800 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python build_sub.py || echo "build failed, keeping previous file"
            git add subscription.txt
            if ! git diff --cached --quiet; then
              git commit -qm "update subscription $(date -u +%H:%M)"
              git pull --rebase -X theirs -q || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; python build_sub.py; git add subscription.txt; git commit -qm "rebuild subscription $(date -u +%H:%M)"; }
              git push -q || echo "push failed, retry next round"
            fi
            sleep 1200
          done

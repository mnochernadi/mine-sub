name: build-subscription
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild]
permissions:
  contents: write
concurrency:
  group: build-subscription
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build subscription
        env:
          OWN_NODES: ${{ secrets.OWN_NODES }}
        run: python build_sub.py
      - name: Commit and push
        run: |
          git config user.name "sub-bot"
          git config user.email "sub-bot@users.noreply.github.com"
          git add subscription.txt
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -qm "update subscription $(date -u +%H:%M)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q && git push -q; then exit 0; fi
            sleep 5
          done
          exit 1
